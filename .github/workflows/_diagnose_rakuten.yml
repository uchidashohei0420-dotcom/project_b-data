name: _diagnose_rakuten (temporary)
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call Rakuten Ichiba Item Search API and print the full response
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: |
          python3 -c "
          import os, urllib.request, urllib.parse, json

          app_id = os.environ['RAKUTEN_APP_ID']
          params = {
              'applicationId': app_id,
              'keyword': 'あたしンチ',
              'hits': 5,
              'formatVersion': 2,
          }
          url = 'https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601?' + urllib.parse.urlencode(params)
          print('URL (app id redacted by Actions):', url)
          req = urllib.request.Request(url, headers={'User-Agent': 'atashinchi-watch-diagnostic/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print('STATUS:', resp.status)
                  print('BODY:', resp.read().decode('utf-8')[:2000])
          except urllib.error.HTTPError as e:
              print('HTTP ERROR STATUS:', e.code)
              print('BODY:', e.read().decode('utf-8')[:2000])
          "
