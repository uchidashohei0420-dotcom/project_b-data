name: _diagnose_twitter (temporary)
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the auth section of twitter-cli's README
        run: |
          curl -sL https://raw.githubusercontent.com/public-clis/twitter-cli/main/README.md > /tmp/readme.md
          echo "--- lines mentioning TOKEN/ct0/env/AUTH (with context) ---"
          grep -n -i -B2 -A6 "auth_token\|TWITTER_AUTH\|TWITTER_CT0\|environment variable" /tmp/readme.md || true

      - name: Install twitter-cli directly via pip
        run: pip install twitter-cli

      - name: Show installed command and version
        run: |
          which twitter
          twitter --version || twitter version || true

      - name: Real call against our actual account (env-var auth)
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          echo "--- twitter user-posts atashinchi_new --json (first 1500 chars) ---"
          twitter user-posts atashinchi_new --json 2>&1 | head -c 1500 || true
          echo
          echo "--- twitter search あたしンち --json (first 1500 chars) ---"
          twitter search "あたしンち" --json 2>&1 | head -c 1500 || true
