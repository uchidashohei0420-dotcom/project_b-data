name: _diagnose_twitter (temporary)
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: pip install https://github.com/Panniantong/agent-reach/archive/main.zip

      - name: Inspect agent-reach CLI surface
        run: |
          echo "--- agent-reach --help ---"
          agent-reach --help || true
          echo "--- agent-reach install --help ---"
          agent-reach install --help || true

      - name: Look for a twitter-specific subcommand or install path
        run: |
          echo "--- searching installed agent-reach package for 'twitter' ---"
          python3 -c "import agent_reach, os; print(os.path.dirname(agent_reach.__file__))" || true
          PKG_DIR=$(python3 -c "import agent_reach, os; print(os.path.dirname(agent_reach.__file__))" 2>/dev/null)
          if [ -n "$PKG_DIR" ]; then
            grep -rli "twitter" "$PKG_DIR" | head -20 || true
          fi

      - name: Check whether `twitter` CLI exists under any name already
        run: |
          which twitter || echo "no 'twitter' on PATH"
          which twitter-cli || echo "no 'twitter-cli' on PATH"
          pip show twitter-cli 2>&1 || echo "not a pip package named twitter-cli"

      - name: Fetch the real public-clis/twitter-cli README for install instructions
        run: |
          curl -sL https://raw.githubusercontent.com/public-clis/twitter-cli/main/README.md | head -150
