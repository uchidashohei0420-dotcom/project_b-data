name: _diagnose_twitter (temporary)
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the auth section of twitter-cli's README
        run: |
          curl -sL https://raw.githubusercontent.com/public-clis/twitter-cli/main/README.md > /tmp/readme.md
          echo "--- lines mentioning TOKEN/ct0/env/AUTH (with context) ---"
          grep -n -i -B2 -A6 "auth_token\|TWITTER_AUTH\|TWITTER_CT0\|environment variable" /tmp/readme.md || true

      - name: Install twitter-cli directly via pip
        run: pip install twitter-cli

      - name: Show installed command and version
        run: |
          which twitter
          twitter --version || twitter version || true

      - name: Real call against our actual account (env-var auth)
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          echo "--- twitter user-posts atashinchi_new --json (first 3000 chars, full item) ---"
          twitter user-posts atashinchi_new --json 2>&1 | head -c 3000 || true
          echo
          echo "--- twitter search --help ---"
          twitter search --help 2>&1 || true
          echo
          echo "--- twitter search あたしンち (no --json, verbose) ---"
          twitter search "あたしンち" -v 2>&1 | head -c 2000 || true
          echo
          echo "--- twitter search atashinchi (ascii keyword) --json ---"
          twitter search "atashinchi" --json 2>&1 | head -c 1000 || true

      - name: Inspect installed twitter-cli source for the search command
        run: |
          PKG_DIR=$(python3 -c "import twitter_cli, os; print(os.path.dirname(twitter_cli.__file__))")
          echo "package dir: $PKG_DIR"
          grep -rn "def search\|search_tweets\|SearchTimeline\|/search" "$PKG_DIR" | head -50
