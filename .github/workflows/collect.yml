name: Collect feed

on:
  schedule:
    # UTC. 0 0,6,12 * * * = JST 9:00 / 15:00 / 21:00
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      # Installs twitter-cli (the backend agent-reach sets up). Verified against
      # https://github.com/Panniantong/agent-reach and https://github.com/public-clis/twitter-cli
      # READMEs (2026-08); not yet exercised in a real Actions run — if this breaks, SNS
      # collection is skipped for the run (fault-isolated) rather than failing the job.
      - run: |
          pip install https://github.com/Panniantong/agent-reach/archive/main.zip
          agent-reach install --env=auto || echo "::warning::agent-reach install failed; sns_x collection will be skipped this run"

      - run: python -m collector.main
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
