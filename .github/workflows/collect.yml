name: Collect feed

on:
  schedule:
    # UTC. 0 0,6,12 * * * = JST 9:00 / 15:00 / 21:00
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      # TODO: verify the actual install command for Agent Reach (https://github.com/Panniantong/agent-reach)
      # before the first real run — this assumes a pip-installable CLI, unverified.
      - run: pip install agent-reach || echo "::warning::agent-reach install failed; sns_x collection will be skipped this run"

      - run: python -m collector.main
        env:
          AGENT_REACH_X_COOKIE: ${{ secrets.AGENT_REACH_X_COOKIE }}
