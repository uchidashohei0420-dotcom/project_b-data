name: Collect feed

on:
  schedule:
    # UTC. 0 0,6,12 * * * = JST 9:00 / 15:00 / 21:00
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      # twitter-cli is a standalone PyPI package (not something `agent-reach install`
      # sets up, despite an earlier assumption) — verified via a real Actions run
      # (2026-08-22) that plain `pip install twitter-cli` provides the `twitter` binary
      # used by collector/sources/sns_x.py. If this breaks, SNS collection is
      # fault-isolated and skipped for the run rather than failing the whole job.
      - run: pip install twitter-cli || echo "::warning::twitter-cli install failed; sns_x collection will be skipped this run"

      - name: _debug PATH and twitter binary location (temporary)
        run: |
          echo "PATH=$PATH"
          which twitter || echo "twitter not found by which"
          python3 -c "import twitter_cli, os; print('module at', twitter_cli.__file__)"
          find / -xdev -name "twitter" -type f 2>/dev/null | head -20

      - run: python -m collector.main
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
